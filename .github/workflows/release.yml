name: Release

# Push a tag like v1.0.1 to publish a release containing module.zip and a
# module.json whose version, manifest and download URLs point at that release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp module.json
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" --arg repo "$REPO" --arg tag "$TAG" '
            .version = $v
            | .url = "https://github.com/\($repo)"
            | .bugs = "https://github.com/\($repo)/issues"
            | .manifest = "https://github.com/\($repo)/releases/latest/download/module.json"
            | .download = "https://github.com/\($repo)/releases/download/\($tag)/module.zip"
          ' module.json > module.tmp && mv module.tmp module.json

      - name: Build module.zip
        run: zip -r module.zip module.json LICENSE README.md scripts styles lang

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" module.json module.zip --clobber
          else
            gh release create "$TAG" module.json module.zip --title "$TAG" --generate-notes
          fi
