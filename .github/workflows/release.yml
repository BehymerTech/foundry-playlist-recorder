name: Release

# Publish a GitHub release (tag vX.Y.Z) to build module.zip and attach it with a
# module.json whose version, manifest and download URLs point at that release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp module.json
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" --arg repo "$REPO" --arg tag "$TAG" '
            .version = $v
            | .url = "https://github.com/\($repo)"
            | .bugs = "https://github.com/\($repo)/issues"
            | .manifest = "https://github.com/\($repo)/releases/latest/download/module.json"
            | .download = "https://github.com/\($repo)/releases/download/\($tag)/module.zip"
          ' module.json > module.tmp && mv module.tmp module.json

      - name: Build module.zip
        run: zip -r module.zip module.json LICENSE README.md scripts styles lang

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" module.json module.zip --clobber
